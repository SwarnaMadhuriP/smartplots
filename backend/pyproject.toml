[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "fastapi>=0.136.3",
    "google-adk>=2.3.0",
    "google-genai>=2.9.0",
    "langchain-anthropic>=1.4.4",
    "langgraph>=1.2.4",
    "pgvector>=0.4.2",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
